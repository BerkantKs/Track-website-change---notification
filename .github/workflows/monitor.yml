name: Nintendo stock monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: check
        type: choice
        options:
          - check
          - test-notification

permissions:
  contents: write
  issues: write

concurrency:
  group: nintendo-stock-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install monitor
        run: python -m pip install .

      - name: Check product
        id: check
        if: github.event_name == 'schedule' || inputs.operation == 'check'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ASSIGNEE: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m nintendo_stock_monitor check

      - name: Send test notification
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'test-notification'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ASSIGNEE: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m nintendo_stock_monitor test-notification

      - name: Commit monitor state
        if: >-
          (github.event_name == 'schedule' || inputs.operation == 'check') &&
          steps.check.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- .monitor/state.json; then
            echo "Monitor state is unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .monitor/state.json
          git commit -m "chore: update monitor state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
